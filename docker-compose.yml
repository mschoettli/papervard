services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: papervard
      POSTGRES_USER: papervard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papervard -d papervard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${PAPERVARD_IMAGE:-ghcr.io/mschoettli/papervard:latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://papervard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/papervard?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_COOKIE_SECURE: "false"
      GITHUB_REPOSITORY: mschoettli/papervard
      GITHUB_BRANCH: main
      UPDATE_API_URL: http://watchtower:8080/v1/update
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:?Set WATCHTOWER_HTTP_API_TOKEN in .env}
      PDF_STORAGE_PATH: /app/storage/pdfs
      EMBEDDING_MODEL_PATH: /app/models/multilingual-local
      OCR_LANGUAGES: deu+eng+fra+ita+spa
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@papervard.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
    ports:
      - "3000:3000"
    volumes:
      - pdf_storage:/app/storage/pdfs
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command: sh -c "./node_modules/.bin/prisma migrate deploy && npm run db:seed && node server.js"

  watchtower:
    image: containrrr/watchtower:latest
    environment:
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:?Set WATCHTOWER_HTTP_API_TOKEN in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --http-api-update --label-enable --cleanup --rolling-restart

volumes:
  postgres_data:
  pdf_storage:
